<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clone Sweeper</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/code.js"></script>
  </head>
  <body>
    <div id="rip">
      <div id="riptitle">RIP</div>
      <button id="redo-button">Try again</button>
    </div>
    <div id="parent-div">
      <div id="tile-grid">
        <div id="loading">
          <div class="spinner"></div>
          <div class="loading-title">CLONE SWEEPER</div>
          <div class="loading-sub">LOADING</div>
        </div>
      </div>
      <div>
        <button id="redo-button">DEBUG Start over!</button>
        <button id="showall-button">DEBUG Show all</button>
      </div>
      <div id="stats">JORGE POWER</div>
      <button id="level-up">Level up!</button>
    </div>
    <div id="sprites"></div>
    <div id="popup-guess">
      <div>1</div>
      <div>2</div>
      <div>3</div>
      <div>4</div>
      <div>5</div>
      <div>6</div>
      <div>7</div>
      <div>8</div>
      <div>9</div>
      <div>10</div>
      <div>11</div>
      <div>12</div>
      <div>100</div>
      <div>?</div>
      <div>A</div>
      <div>-</div>
    </div>
  </body>
</html>
